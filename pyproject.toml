[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "klineo-liquidity-os"
version = "2.0.0"
description = "Typed, non-custodial Python client for the Klineo Liquidity Operating System v2 API"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.klineo.io"
Source = "https://github.com/Klineo-Ecosystem/klineo-python-sdk"
Issues = "https://github.com/Klineo-Ecosystem/klineo-python-sdk/issues"

[tool.setuptools.packages.find]
include = ["klineo_liquidity_os*"]

[tool.setuptools.package-data]
klineo_liquidity_os = ["py.typed"]
