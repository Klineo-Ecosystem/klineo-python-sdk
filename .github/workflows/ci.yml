name: Python SDK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify installed wheel outside the checkout
        working-directory: /tmp
        run: python -c "from importlib.metadata import version; from klineo_liquidity_os import LiquidityOsClient, __version__; assert __version__ == version('klineo-liquidity-os'); assert callable(LiquidityOsClient.list_scores)"
