name: Python SDK release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from klineo_liquidity_os import __version__
          with open("pyproject.toml", "rb") as source:
              package_version = tomllib.load(source)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == "v" + package_version
          assert __version__ == package_version
          PY
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify wheel imports outside the checkout
        working-directory: /tmp
        run: python -c "from klineo_liquidity_os import LiquidityOsClient, LiquidityOsApiError; assert callable(LiquidityOsClient.list_scores)"
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes
